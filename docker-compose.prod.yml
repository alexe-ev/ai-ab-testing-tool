services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    restart: unless-stopped
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - app-network

volumes:
  caddy_data:
  caddy_config:
  app_data:

networks:
  app-network:
